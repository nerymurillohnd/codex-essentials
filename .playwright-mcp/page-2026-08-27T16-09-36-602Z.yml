                            - paragraph [ref=e603]:
                                - strong [ref=e604]: Codex Essentials
                                - text: is a community marketplace and data repository for distributable Codex plugins. It provides the catalog, schemas, generators, validators, documentation, and quality gates needed to publish reusable skills, MCP integrations, and supporting assets.
