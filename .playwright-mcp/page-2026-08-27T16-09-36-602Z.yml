                                    - /url: "#-start-here"
                            - paragraph [ref=e615]:
                                - text: Codex Essentials is the distribution layer. Its own
                                - code [ref=e616]: npm
                                - text: dependencies maintain the catalog and quality gates; they are
                                - strong [ref=e617]: not installed into every user's Astro project
                                - text: . Users add the remote marketplace and install only the plugins they need.
