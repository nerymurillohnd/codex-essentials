                                - text: .
                            - paragraph [ref=e817]:
                                - text: The repository runs on Node 24 and keeps TypeScript 7 and TypeScript 6 compatibility checks. CI is authoritative, uses full SHA pins, and protects branch-required checks with release environment approval. Local hooks are no-shim and advisory;
                                - code [ref=e818]: HUSKY=0
                                - text: is used in CI, while authorized local emergency bypasses use
                                - code [ref=e819]: HUSKY=0
                                - text: or
                                - code [ref=e820]: "--no-verify"
                                - text: ". The contributor quality vocabulary is:"
                                - code [ref=e821]: npm run format:check
                                - text: ","
