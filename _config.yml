# These files are authoring templates, not publishable pages. Their intentional
# YYYY-MM-DD placeholders are invalid Jekyll dates until a new document is copied
# and populated.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/decisions/adr-template.md
  - plugins/doc-keeper/skills/doc-keeper/outputs/adr-example.md
