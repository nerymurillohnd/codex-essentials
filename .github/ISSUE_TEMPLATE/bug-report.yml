name: Plugin bug report
description: Report a reproducible problem in a marketplace plugin.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: plugin_id
    attributes:
      label: Plugin identifier
      placeholder: example-plugin
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include deterministic commands without credential values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Codex, OS, Node.js, and plugin versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, and private data from this report.
          required: true
