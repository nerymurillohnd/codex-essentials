name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin packages
        run: python3 scripts/validate.py
      - name: Validate architecture decisions
        run: python3 scripts/validate_adrs.py
      - name: Validate issue forms and labels
        run: python3 scripts/validate_issues.py
      - name: Check generated catalog and plugin metadata
        run: python3 scripts/sync_catalog.py --check
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v
