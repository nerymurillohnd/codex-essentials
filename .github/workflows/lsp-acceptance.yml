name: LSP acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Prepare Node through nvm
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v0.40.8 https://github.com/nvm-sh/nvm.git "$RUNNER_TEMP/nvm"
          test "$(git -C "$RUNNER_TEMP/nvm" rev-parse HEAD)" = a885b885fef16fac4bc544188fb25e9e37ae83e8
          export NVM_DIR="$RUNNER_TEMP/nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 26.11.1
          nvm use 26.11.1
          echo "$NVM_BIN" >> "$GITHUB_PATH"
      - name: Install public development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select the locked npm release
        run: |
          test "$(node node_modules/npm/bin/npm-cli.js --version)" = 12.2.0
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Install the pinned test runtime
        run: node plugins/lsp-intelligence/scripts/runtime.mjs install --profile all --runtime-root .lsp-test-runtime/managed
      - name: Validate package and fixtures
        run: uv run python scripts/preflight.py pr
      - name: Exercise real Linux language servers
        run: npm run test:lsp:integration
      - name: Verify the distribution archive
        run: uv run python scripts/preflight.py release lsp-intelligence
