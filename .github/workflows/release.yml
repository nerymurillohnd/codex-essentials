name: Release plugin

on:
  push:
    tags:
      - 'plugin/*/v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag and package plugin
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          metadata="$(python3 scripts/check_release_tag.py "$RELEASE_TAG")"
          read -r plugin version <<< "$metadata"
          python3 scripts/preflight.py release "$plugin"
          python3 scripts/release_notes.py "$plugin" "$version" > release-notes.md
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLUGIN: ${{ steps.package.outputs.plugin }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$PLUGIN-v$VERSION.zip" \
            --title "$PLUGIN v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
