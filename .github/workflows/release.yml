name: Plugin releases

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap:
        description:
          Create the initial 0.1.0 releases after the clean-history cutover
        required: false
        default: false
        type: boolean

concurrency:
  group: plugin-releases-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish plugin releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

      - name: Publish initial plugin releases
        if: inputs.bootstrap == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --bootstrap --apply

      - name: Publish later plugin releases
        if: inputs.bootstrap != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --apply
