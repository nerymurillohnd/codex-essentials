name: Plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in plugin/<plugin-id>/v<semver> format"
        required: true
        type: string
  push:
    tags:
      - "plugin/**/v*"

permissions:
  contents: read

env:
  HUSKY: "0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_checksum: ${{ steps.metadata.outputs.artifact_checksum }}
      plugin_version: ${{ steps.metadata.outputs.plugin_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate manifests and product documentation
        run: npm run validate:all
      - name: Validate release contract
        run: npm run validate:release -- "$RELEASE_TAG"
      - name: Run distributable smoke test
        run: npm pack --dry-run
      - name: Capture release metadata
        id: metadata
        run: |
          plugin_version="${RELEASE_TAG##*/v}"
          pack_metadata="$(npm pack --dry-run --json)"
          artifact_checksum="$(printf '%s' "$pack_metadata" | shasum -a 256 | awk '{print $1}')"
          {
            echo "plugin_version=$plugin_version"
            echo "artifact_checksum=$artifact_checksum"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: Draft release
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ success() }}
    permissions:
      contents: write
    env:
      ARTIFACT_CHECKSUM: ${{ needs.validate.outputs.artifact_checksum }}
      GH_TOKEN: ${{ github.token }}
      PLUGIN_VERSION: ${{ needs.validate.outputs.plugin_version }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Build release notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        with:
          configuration: ".github/release.yml"
          failOnError: true
          fromTag: ${{ github.event.before }}
          toTag: ${{ github.sha }}
      - name: Prevent duplicate tag releases
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG"
            exit 1
          fi
      - name: Write release metadata
        run: |
          {
            echo "${{ steps.changelog.outputs.changelog }}"
            echo
            echo "Release tag: $RELEASE_TAG"
            echo "Plugin version: $PLUGIN_VERSION"
            echo "Changelog source: .github/release.yml"
            echo "Artifact checksum: $ARTIFACT_CHECKSUM"
            echo "Rollback: restore the previous marketplace metadata, delete this release, and delete tag $RELEASE_TAG."
          } > release-notes.md
      - name: Publish draft release metadata
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file release-notes.md

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: draft
    if: ${{ success() }}
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish approved release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false
