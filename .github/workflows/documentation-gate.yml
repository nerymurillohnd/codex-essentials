name: Marketplace contract gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

env:
  HUSKY: "0"

jobs:
  documentation:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read current pull request labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name] | join(",")')"
          printf 'value=%s\n' "$labels" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate plugin manifests and generated marketplace
        run: npm run marketplace:check
      - name: Enforce plugin documentation synchronization
        run: |
          npm run documentation:gate -- \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --title "$PR_TITLE" \
            --author-type "$PR_AUTHOR_TYPE" \
            --labels "${{ steps.labels.outputs.value }}"
