name: Quality

on:
  push:
    branches:
      - codex/rebuild-main
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.18
          python-version: "3.14"

      - name: Pin npm and shell gate tools
        run: |
          npm install --global npm@12.0.2
          bash scripts/install_ci_gate_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Validate marketplace
        run: npm run check
