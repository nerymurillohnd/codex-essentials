name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install repository gate tools
        run: scripts/install_ci_gate_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check
