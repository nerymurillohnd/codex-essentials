name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository gate tools
        run: |
          python3 -m pip install --user ruff==0.16.7
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shfmt_version="3.14.1"
          curl -fsSLo shfmt "https://github.com/mvdan/sh/releases/download/v${shfmt_version}/shfmt_v${shfmt_version}_linux_amd64"
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check
